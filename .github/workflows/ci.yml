name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [producer, spark, summarizer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: ${{ matrix.module }}/pom.xml
      - name: Build ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        run: mvn -B -q package